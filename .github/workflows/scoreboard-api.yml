name: Scoreboard API CI

on:
  push:
    branches: [main]
    paths:
      - "scoreboard-api/**"
      - ".github/workflows/scoreboard-api.yml"
  pull_request:
    paths:
      - "scoreboard-api/**"
      - ".github/workflows/scoreboard-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scoreboard-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v